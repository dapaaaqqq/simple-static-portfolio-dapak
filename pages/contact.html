<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Advan Daffa</title>
    <link rel="stylesheet" href="../pages/contact.css">
</head>
<body>
    <div class="container">
        
        <header>
            <nav>
                    <img src="../assets/IMG_20260803_153326.jpg" alt="Foto Daffa" class="profile-pic">
                    <ul>
                        <li><a href="../index.html"> About </a></li>
                        <li><a href="../pages/project.html"> Projects </a></li>
                        <li><a href="../pages/contact.html"> Contact me </a></li>
                    </ul>
                </a>
            </nav>
        </header>

        
        <main class="contact-section">
            <h1>Send Message For Me Here!</h1>
            <p class="subtitle">Always happy to chat, collaborate, or just geek out over tech stuff. Drop me a message!</p>

            <form class="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="What's on your mind?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div class="social-links">
                <h2>Or find me here:</h2>
                <div class="icons">
                    <a href="https://github.com/usernamekamu" target="_blank">
                        <img src="../assets/github.svg" alt="GitHub">
                    </a>
                    <a href="https://linkedin.com/in/usernamekamu" target="_blank">
                        <img src="../assets/linkedin.svg" alt="LinkedIn">
                    </a>
                </div>
            </div>

        </main>

        <footer class="footer">
            <p>© 2024 Advan Daffa Pamungkas</p>
        </footer>
    </div>
</body>
</html>
